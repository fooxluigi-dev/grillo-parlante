<!DOCTYPE html>
<html>
<head><title>Scan with Camera</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui;background:#faf5ef;text-align:center;padding:40px 20px;color:#2a2018;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  h1{font-size:1.5rem;margin-bottom:4px}
  p{color:#8a7a68;font-size:.9rem;margin:8px 0 20px;max-width:320px}
  img{max-width:260px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.15)}
  .box{background:#f8f2ea;border-radius:16px;padding:16px;margin-top:16px;max-width:320px;width:100%}
  .code{font-size:.8rem;word-break:break-all;color:#2a2018;font-weight:600;margin:8px 0}
  .btn{display:inline-block;padding:14px 28px;border-radius:16px;background:linear-gradient(135deg,#e8a832,#f5c45a);color:#2a2018;font-weight:700;text-decoration:none;margin-top:8px;font-size:.9rem}
</style>
</head>
<body>
  <h1>🦗 Grillo Parlante</h1>
  <p>Scan QR with Camera → opens in Expo Go</p>

  <img src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=exp%3A%2F%2Fibzbe6q-anonymous-8081.exp.direct" alt="QR">

  <div class="box">
    <p style="margin:0"><b>📱 Expo Go → Profile → Scan QR</b></p>
    <div class="code">exp://ibzbe6q-anonymous-8081.exp.direct</div>
  </div>

  <a class="btn" href="exp://ibzbe6q-anonymous-8081.exp.direct">🚀 Open in Expo Go</a>
</body>
</html>
